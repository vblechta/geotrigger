services:
  web:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      DATABASE_URL: sqlite:///geotrigger.db
    volumes:
      - ./data:/app/instance
    labels:
      - traefik.enable=true
      - traefik.http.services.geotrigger.loadbalancer.server.port=5000
      - traefik.http.routers.geotrigger.rule=Host(`${TRG_HOST:?Set TRG_HOST}`)
      - traefik.http.routers.geotrigger.entrypoints=web,websecure
      - traefik.http.routers.geotrigger.tls=true
      - traefik.http.routers.geotrigger.tls.certresolver=letsencrypt
    networks:
      - proxy-network
