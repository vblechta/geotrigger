services:
  web:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      DATABASE_URL: sqlite:///geotrigger.db
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - geotrigger-data:/app/instance

volumes:
  geotrigger-data:
