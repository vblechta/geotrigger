[project]
name = "geotrigger"
version = "1.0.0"
description = "Presence timekeeping for named GPS locations"
requires-python = ">=3.11"
dependencies = [
  "flask==3.1.2",
  "flask-sqlalchemy==3.1.1",
  "flask-login==0.6.3",
  "flask-wtf==1.2.2",
  "python-dotenv==1.1.1",
  "gunicorn==23.0.0",
  "werkzeug==3.1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geotrigger*"]
